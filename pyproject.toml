[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helpix-r"
version = "1.0.0"
description = "Reliability-Oriented Binary Skin-Lesion Malignancy Classification Framework"
readme = "README.md"
authors = [
    { name = "Chhotu", email = "[TO BE PROVIDED]" },
    { name = "Dr. Rishi Gupta", email = "[TO BE PROVIDED]" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=1.0.0",
    "grad-cam>=1.5.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "opencv-python>=4.7.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
