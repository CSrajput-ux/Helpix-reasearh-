# HELPix-R Training Configuration
# ===============================

model:
  name: "helpix_r"
  backbone: "efficientnet_b0"
  feature_stages: [1, 2, 3, 5, 7]
  feature_channels: [16, 24, 40, 112, 320]
  fusion_dim: 512
  classifier_hidden_dim: 256
  dropout_rate: 0.3
  num_classes: 2

image:
  size: 224
  channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  random_horizontal_flip: true
  random_vertical_flip: true
  random_rotation_degrees: 20
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1

optimization:
  optimizer: "AdamW"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "ReduceLROnPlateau"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 2
  early_stopping_patience: 3
  epochs: 15
  batch_size: 32
  loss: "FocalLoss"
  focal_loss:
    alpha: 1.0
    gamma: 2.0
  sampler: "WeightedRandomSampler"

hardware:
  device: "cuda"
  amp_enabled: true
  num_workers: 2
  pin_memory: true
  seed: 42
